[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collision-zone-ed"
version = "0.1.0"
description = "Rescuing Diagnostic Signal from True-Negative Abundance: High-Signal False Positives and Collision-Zone Feature Acquisition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14.0",
  "scikit-learn>=1.4",
  "lightgbm>=4.1",
  "matplotlib>=3.8",
  "pyreadr>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
